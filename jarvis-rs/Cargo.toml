[package]
name = "jarvis"
version = "0.1.0"
edition = "2021"
description = "Thin Rust supervisor and browser-task broker for voice-controlled Jev + S2S"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
